<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود | ریاضی بات</title>
<link rel="icon" type="image/png" href="4.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, sans-serif; }
  body {
    min-height:100vh;
    background: radial-gradient(circle at 50% 0%, #2a0a4a 0%, #12001f 50%, #000 100%);
    color:#e6d4ff; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px; overflow-x:hidden;
  }
  
  /* ربات بالای صفحه */
  .robot-mini { width:70px; height:82px; position:relative; margin-bottom:25px; animation:float 2.8s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
  .robot-head-mini {
    width:100%; height:45px; background:linear-gradient(160deg, #c9a3ff 0%, #9b4dff 40%, #6b1fcc 100%);
    border-radius:18px; box-shadow:inset 0 3px 6px rgba(255,255,255,.35), 0 4px 15px rgba(123,44,255,.4);
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .eye-mini { width:10px; height:13px; background:#e0b3ff; border-radius:50%; box-shadow:0 0 8px #c38bff; }
  .robot-body-mini {
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:46px; height:36px; background:linear-gradient(160deg, #c9a3ff 0%, #9b4dff 40%, #6b1fcc 100%);
    border-radius:50% 50% 45% 45% / 40% 40% 60% 60%;
  }

  /* دکمه‌های اصلی */
  .btn-grid {
    width:100%; max-width: 380px; display: grid; grid-template-columns: 1fr 1fr;
    gap: 15px; margin-bottom: 20px; z-index: 10; transition: opacity 0.3s, transform 0.3s;
  }
  .btn-grid.hide { opacity: 0; pointer-events: none; transform: translateY(-20px); }
  .action-btn {
    padding: 20px 10px; background: rgba(0,0,0,0.4); border: 2px solid #9b4dff;
    border-radius: 15px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer;
    box-shadow: 0 4px 15px rgba(123,44,255,.2); transition: .3s; backdrop-filter: blur(5px);
    display: flex; align-items: center; justify-content: center; text-align: center; text-decoration: none;
  }
  .action-btn:hover { background: rgba(123,44,255,.4); box-shadow: 0 8px 25px rgba(155,77,255,.5); transform: translateY(-3px); }
  .btn-full { grid-column: 1 / -1; }

  /* فرم‌ها */
  .form-container {
    width: 100%; max-width: 380px; display: none; background: rgba(0,0,0,0.6);
    border: 2px solid #7b2cff; border-radius: 20px; padding: 25px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 20px rgba(123,44,255,0.3);
    backdrop-filter: blur(10px); animation: formAppear 0.4s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  .form-container.active { display: block; }
  @keyframes formAppear { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .form-container h2 { text-align: center; color: #c38bff; margin-bottom: 20px; font-size: 20px; }
  
  .input-group { margin-bottom: 15px; text-align: right; }
  .input-group label { display: block; margin-bottom: 6px; font-size: 13px; color: #b48cff; }
  .input-group input {
    width: 100%; padding: 12px; background: rgba(255,255,255,0.1); border: 1px solid #7b2cff;
    border-radius: 10px; color: #fff; font-size: 15px; outline: none; transition: 0.3s;
  }
  .input-group input:focus { border-color: #c38bff; box-shadow: 0 0 10px rgba(195,139,255,0.5); }
  
  .submit-btn {
    width: 100%; padding: 14px; background: #7b2cff; border: none; border-radius: 10px;
    color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: .3s;
  }
  .submit-btn:hover { background: #9b4dff; box-shadow: 0 0 15px #9b4dff; }
  .cancel-btn { width: 100%; padding: 10px; background: transparent; border: none; color: #b48cff; font-size: 14px; cursor: pointer; margin-top: 10px; text-decoration: underline; }
  .cancel-btn:hover { color: #fff; }
  .error-msg { color: #ff4d4d; font-size: 13px; margin-bottom: 10px; display: none; text-align: center; }

  /* دکمه روبیکا */
  .rubika-btn {
    width: 100%; max-width: 380px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: linear-gradient(90deg, #ff416c, #ff4b2b);
    color: white; text-decoration: none;
    padding: 15px; border-radius: 15px;
    font-size: 16px; font-weight: bold;
    box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
    transition: 0.3s; margin-top: 5px;
  }
  .rubika-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255, 65, 108, 0.6); }
</style>
</head>
<body>

<!-- ربات کوچیک -->
<div class="robot-mini">
  <div class="robot-head-mini">
    <div class="eye-mini"></div>
    <div class="eye-mini"></div>
  </div>
  <div class="robot-body-mini"></div>
</div>

<!-- دکمه‌های اصلی -->
<div class="btn-grid" id="mainButtons">
  <button class="action-btn btn-full" onclick="showForm('loginForm')"> ورود</button>
  <button class="action-btn" onclick="showForm('registerForm')"> ثبت‌نام</button>
  <button class="action-btn" onclick="showForm('adminForm')"> ورود ادمین</button>
</div>

<!-- فرم ورود -->
<div class="form-container" id="loginForm">
  <h2>ورود به حساب</h2>
  <div class="error-msg" id="loginError"></div>
  <div class="input-group">
    <label>نام کاربری</label>
    <input type="text" id="loginUser" placeholder="نام کاربری">
  </div>
  <div class="input-group">
    <label>رمز عبور</label>
    <input type="password" id="loginPass" placeholder="رمز عبور">
  </div>
  <button class="submit-btn" onclick="doLogin()">ورود</button>
  <button class="submit-btn onclick="hideForms()">بازگشت</button>
</div>

<!-- فرم ثبت‌نام -->
<div class="form-container" id="registerForm">
  <h2>ساخت حساب جدید</h2>
  <div class="error-msg" id="regError"></div>
  <div class="input-group">
    <label>نام کاربری</label>
    <input type="text" id="regUser" placeholder="یک نام کاربری انتخاب کنید">
  </div>
  <div class="input-group">
    <label>ایمیل</label>
    <input type="text" id="regEmail" placeholder="example@mail.com" style="direction: ltr; text-align: right;">
  </div>
  <div class="input-group">
    <label>رمز عبور</label>
    <input type="password" id="regPass" placeholder="رمز عبور خود را وارد کنید">
  </div>
  <div class="input-group">
    <label>تکرار رمز عبور</label>
    <input type="password" id="regPassConfirm" placeholder="رمز عبور را دوباره وارد کنید">
  </div>
  <button class="submit-btn" onclick="doRegister()">ثبت‌نام</button>
  <button class="submit-btn" onclick="hideForms()">بازگشت</button>
</div>

<!-- فرم ادمین -->
<div class="form-container" id="adminForm">
  <h2>ورود ادمین</h2>
  <div class="error-msg" id="adminError"></div>
  <div class="input-group">
    <label>نام کاربری ادمین</label>
    <input type="text" id="adminUser" placeholder="نام کاربری">
  </div>
  <div class="input-group">
    <label>رمز عبور ادمین</label>
    <input type="password" id="adminPass" placeholder="رمز عبور">
  </div>
  <button class="submit-btn" onclick="doAdminLogin()">ورود به پنل</button>
  <button class="submit-btn" onclick="hideForms()">بازگشت</button>
</div>

<!-- دکمه روبیکا -->
<!--<a href="https://rubika.ir/A_m_i_r___W_o_l_f" target="_blank" class="rubika-btn" id="rubikaLink">
  <span style="font-size: 20px;">💬</span>
  ارتباط با ما در روبیکا
</a>
<!--بقیه کد فعال-->
<script>
  const mainButtons = document.getElementById('mainButtons');
  const allForms = document.querySelectorAll('.form-container');

  function showForm(formId) {
    mainButtons.classList.add('hide');
    allForms.forEach(f => f.classList.remove('active'));
    setTimeout(() => { document.getElementById(formId).classList.add('active'); }, 200);
  }

  function hideForms() {
    allForms.forEach(f => f.classList.remove('active'));
    setTimeout(() => { mainButtons.classList.remove('hide'); }, 200);
    document.getElementById('loginError').style.display = 'none';
    document.getElementById('regError').style.display = 'none';
    document.getElementById('adminError').style.display = 'none';
  }

  function doLogin() {
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value;
    const err = document.getElementById('loginError');

    if (!user || !pass) { err.textContent = 'لطفاً تمام فیلدها را پر کنید.'; err.style.display = 'block'; return; }

    const users = JSON.parse(localStorage.getItem('mathbot_users') || '{}');
    if (users[user] && users[user].password === pass) {
      localStorage.setItem('mathbot_currentUser', user);
      window.location.href = 'dashboard.html';
    } else {
      err.textContent = 'نام کاربری یا رمز عبور اشتباه است.';
      err.style.display = 'block';
    }
  }

  function doRegister() {
    const user = document.getElementById('regUser').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const pass = document.getElementById('regPass').value;
    const passConfirm = document.getElementById('regPassConfirm').value;
    const err = document.getElementById('regError');

    if (!user || !email || !pass || !passConfirm) { err.textContent = 'لطفاً تمام فیلدها را پر کنید.'; err.style.display = 'block'; return; }
    const emailRegex = /^[a-zA-Z0-9@._-]+$/;
    if (!emailRegex.test(email)) { err.textContent = 'ایمیل نامعتبر است! از حروف انگلیسی استفاده کنید.'; err.style.display = 'block'; return; }
    if (pass !== passConfirm) { err.textContent = 'رمزهای عبور مطابقت ندارند!'; err.style.display = 'block'; return; }

    const users = JSON.parse(localStorage.getItem('mathbot_users') || '{}');
    if (users[user]) { err.textContent = 'این نام کاربری قبلاً گرفته شده است.'; err.style.display = 'block'; return; }

    users[user] = { password: pass, email: email };
    localStorage.setItem('mathbot_users', JSON.stringify(users));
    localStorage.setItem('mathbot_currentUser', user);
    window.location.href = 'dashboard.html';
  }

  function doAdminLogin() {
    const user = document.getElementById('adminUser').value.trim();
    const pass = document.getElementById('adminPass').value;
    const err = document.getElementById('adminError');

    if (user === "admin" && pass === "124578963") {
      localStorage.setItem('mathbot_currentUser', 'ADMIN');
      window.location.href = 'admin.html';
    } else {
      err.textContent = 'اطلاعات ادمین اشتباه است!';
      err.style.display = 'block';
    }
  }
</script>

</body>
</html>
